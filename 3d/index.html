<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ghost racer 3d</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #101018;
      }
      canvas {
        display: block;
      }
      #probe {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 10;
        padding: 6px 8px;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #b9f6ca;
        background: rgba(0, 0, 0, 0.55);
        border-radius: 4px;
        white-space: pre;
        pointer-events: none;
      }
      /* Backtick hides the probe with the rest of the dev instruments
         (`loop.ts`), alongside the HUD's tuning panel and debug block. */
      #probe.off {
        display: none;
      }
    </style>
  </head>
  <body>
    <pre id="probe"></pre>
    <script type="module" src="./loop.ts"></script>
  </body>
</html>
